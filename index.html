<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.yadio.io https://pay.mostro.foundation wss:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="homeTitle">Mostro Store · T-shirts</title>
  <meta name="description" content="Mostro T-shirts. Pay with Lightning; your details travel encrypted over Nostr." data-i18n-attr="content:homeDescription">
  <link rel="icon" href="designs/characters/mostro-8b.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/store.css">
  <script type="module" src="src/store/home-page.js"></script>
</head>
<body>
  <header class="store-header">
    <div class="store-header-inner">
      <a class="store-brand" href="index.html">
        <img src="assets/mostro-logo.png" alt="" width="25" height="36">
        <span>Mostro <strong>Store</strong></span>
      </a>
      <nav class="store-nav" aria-label="Store" data-i18n-attr="aria-label:storeNav">
        <a class="nav-link" href="index.html" aria-current="page" data-i18n="collection">Collection</a>
        <button type="button" class="nav-link lang-switch" id="lang-switch" hidden></button>
        <button type="button" class="cart-button" id="cart-button" hidden>
          <span data-icon="cart"></span>
          <span class="cart-count" id="cart-count">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="store-main">
    <section class="hero">
      <h1 data-i18n="heroTitle">Mostro T-shirts</h1>
      <p><span data-i18n="heroLeadStart">Pick your T-shirt, pay with Lightning</span> <span aria-hidden="true">⚡</span> <span data-i18n="heroLeadEnd">and we’ll ship it to your door.</span></p>
    </section>
    <div id="collection">
      <p class="muted" data-i18n="loadingProducts">Loading T-shirts…</p>
    </div>
  </main>

  <footer class="store-footer">
    <p><span data-i18n="footerNote">Lightning payments · Orders encrypted over Nostr</span> · <a href="https://mostro.network">mostro.network</a></p>
  </footer>
</body>
</html>
