<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.yadio.io https://pay.mostro.foundation wss:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remera · Mostro Store</title>
  <link rel="icon" href="designs/characters/mostro-8b.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/store.css">
  <script type="module" src="src/store/product-page.js"></script>
</head>
<body>
  <header class="store-header">
    <div class="store-header-inner">
      <a class="store-brand" href="index.html">
        <img src="designs/characters/mostro-8b.png" alt="" width="30" height="33">
        <span>Mostro <strong>Store</strong></span>
      </a>
      <nav class="store-nav" aria-label="Tienda">
        <a class="nav-link" href="index.html">Colección</a>
        <button type="button" class="cart-button" id="cart-button" hidden>
          <span data-icon="cart"></span>
          <span class="cart-count" id="cart-count">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="store-main">
    <article class="product" id="product" hidden>
      <div class="product-stage product-stage-large">
        <canvas id="product-canvas" role="img"></canvas>
      </div>

      <div class="product-info">
        <h1 class="product-title" id="product-name"></h1>
        <p class="product-lead" id="product-lead" hidden></p>

        <div class="product-options">
          <div class="option">
            <p class="option-label" id="color-label">Color: <span id="color-name"></span></p>
            <div class="color-options" id="color-options" role="radiogroup" aria-labelledby="color-label"></div>
          </div>
          <div class="option">
            <label class="option-label" for="size-select">Talle</label>
            <div class="size-row">
              <select class="select" id="size-select"></select>
              <button type="button" class="button-ghost" id="size-guide-button">
                <span data-icon="ruler"></span> Guía de talles
              </button>
            </div>
          </div>
          <p class="price-box price-mono" id="product-price"></p>
        </div>

        <div class="product-actions">
          <button type="button" class="button-primary button-block button-large" id="add-to-cart">
            <span data-icon="cart"></span> <span id="add-label">Agregar al carrito</span>
          </button>
          <button type="button" class="button-secondary button-block button-large" id="buy-now">
            <span data-icon="bolt"></span> Comprar
          </button>
          <p class="visually-hidden" id="cart-status" aria-live="polite"></p>
          <p class="pay-error" id="storage-warning" role="alert" hidden></p>
        </div>

        <div class="product-details" id="product-details"></div>

        <a class="button-tint button-block" href="index.html"><span data-icon="arrowLeft"></span> Volver</a>
      </div>
    </article>

    <section class="related" id="related-section" aria-labelledby="related-title" hidden>
      <h2 class="section-title" id="related-title">Te puede interesar</h2>
      <div class="product-grid" id="related"></div>
    </section>
  </main>

  <footer class="store-footer">
    <p>Pagos con Lightning · Pedidos cifrados por Nostr · <a href="https://mostro.network">mostro.network</a></p>
  </footer>
</body>
</html>
