# Tests + publish to GitHub Pages (store.mostro.network).
# Every commit pushed to main runs the tests and, if they pass, deploys.
# Pull requests only run the tests.
# Only the files the site needs are published (no docs/, tests/ or scripts/).

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# A deploy in progress is never cancelled: if several commits land on main,
# the running deploy finishes and the newest pending commit deploys next.
# Superseded pull request runs are cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Tests and coverage (≥ 80 %)
        run: npm run coverage

      # Pages deploys from Actions do not run Jekyll, so no .nojekyll is needed
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css catalog.json src assets designs _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
